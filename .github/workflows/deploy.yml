name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      upload_worker_artifact: true
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refuse superseded main revisions
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$CURRENT_SHA" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has advanced; this older deployment is skipped."
          fi

      # wrangler 4 的 engines 要求 Node >= 22
      - name: Setup Node.js
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        if: steps.freshness.outputs.current == 'true'
        run: |
          npm ci

      - name: Download artifact from this verification run
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release

      - name: Validate commit identity and every artifact checksum
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          node scripts/release-artifact.mjs verify release "$GITHUB_SHA"
          cmp wrangler.toml release/config/wrangler.toml
          mkdir -p frontend/dist
          cp -a release/assets/. frontend/dist/

      - name: Setup & Bind Cloudflare D1 Database
        if: steps.freshness.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          DB_ID="${CLOUDFLARE_D1_DATABASE_ID}"

          if [ -n "$DB_ID" ]; then
            echo "✅ 使用 GitHub Secret 中配置的 CLOUDFLARE_D1_DATABASE_ID: $DB_ID"
          else
            echo "🔍 正在通过 Cloudflare REST API 自动查询 D1 数据库 [domain-hub-db]..."

            D1_LIST=$(curl -fsS --max-time 30 -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")
            if ! echo "$D1_LIST" | jq -e '.success == true and (.result | type == "array")' >/dev/null; then
              echo "::error::D1 listing failed; refusing to infer an empty database list or create a replacement."
              exit 1
            fi

            DB_ID=$(echo "$D1_LIST" | jq -r '[.result[] | select(.name=="domain-hub-db")] | if length == 0 then empty elif length == 1 then .[0].uuid else error("Multiple matching D1 databases; configure an explicit database id") end')

            if [ -z "$DB_ID" ] || [ "$DB_ID" == "null" ]; then
              echo "⚡ 正在为您在 Cloudflare 自动一键创建 D1 数据库 [domain-hub-db]..."
              CREATE_RES=$(curl -fsS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"name":"domain-hub-db"}')
              echo "$CREATE_RES" | jq -e '.success == true' >/dev/null

              DB_ID=$(echo "$CREATE_RES" | jq -r '.result.uuid // empty')
            fi
          fi

          if ! [[ "$DB_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::D1 database id is missing or invalid. Deployment is stopped."
            exit 1
          fi
          if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            sed -i "s/change_me_to_your_d1_db_id/$DB_ID/g" wrangler.toml
            echo "🎉 成功将 D1 数据库 ID [$DB_ID] 自动绑定写入 wrangler.toml"
          else
            echo "::error::D1 binding could not be prepared."
            exit 1
          fi

      # 前端已与后端同源（由同一个 Worker 的静态资源发出），构建期不需要知道后端地址。
      # 这一步只剩两件事：绑了自定义域名就关掉 workers.dev / 预览 URL，以及把最终访问地址写进摘要。
      - name: Auto Detect Custom Domain & Configure Worker Routes
        if: steps.freshness.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔍 正在检测 Worker [domain-hub] 是否已绑定自定义域名..."

          # 1. 查询 Custom Domains
          DOMAINS_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" || echo "{}")

          CUSTOM_DOMAIN=$(echo "$DOMAINS_JSON" | jq -r '.result[]? | select(.service=="domain-hub") | .hostname' 2>/dev/null | head -n 1 || echo "")

          # 2. 若未找到，尝试从 Worker Routes 中查找
          if [ -z "$CUSTOM_DOMAIN" ] || [ "$CUSTOM_DOMAIN" == "null" ]; then
            ZONES_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?per_page=50" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" || echo "{}")

            ZONE_IDS=$(echo "$ZONES_JSON" | jq -r '.result[]?.id' 2>/dev/null || echo "")
            for ZID in $ZONE_IDS; do
              ROUTES_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${ZID}/workers/routes" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" || echo "{}")

              ROUTE_PATTERN=$(echo "$ROUTES_JSON" | jq -r '.result[]? | select(.script=="domain-hub" or .service=="domain-hub") | .pattern' 2>/dev/null | head -n 1 || echo "")
              if [ -n "$ROUTE_PATTERN" ] && [ "$ROUTE_PATTERN" != "null" ]; then
                CLEAN_DOMAIN=$(echo "$ROUTE_PATTERN" | sed 's/\*//g' | sed 's/\/*$//' | sed 's/^\/*//')
                if [ -n "$CLEAN_DOMAIN" ]; then
                  CUSTOM_DOMAIN="$CLEAN_DOMAIN"
                  echo "🎉 检测到自定义域名（从 Routes）: https://${CUSTOM_DOMAIN}"
                  break
                fi
              fi
            done
          else
            echo "🎉 检测到自定义域名（从 Custom Domains）: https://${CUSTOM_DOMAIN}"
          fi

          # 3. 根据检测结果配置 workers_dev 和 preview_urls
          if [ -n "$CUSTOM_DOMAIN" ] && [ "$CUSTOM_DOMAIN" != "null" ]; then
            echo "✅ 已绑定自定义域名，注入 workers_dev = false 和 preview_urls = false 到 wrangler.toml"
            # 确保幂等：先删除旧的配置行（如果存在），再追加新配置
            sed -i '/^workers_dev = /d' wrangler.toml
            sed -i '/^preview_urls = /d' wrangler.toml
            # 在 compatibility_date 行之后插入
            sed -i '/^compatibility_date = /a workers_dev = false\npreview_urls = false' wrangler.toml
            echo "APP_URL=https://${CUSTOM_DOMAIN}" >> $GITHUB_ENV
          else
            echo "⚠️ 未检测到自定义域名，保持 workers.dev 和预览 URL 默认开启"
            # 查询默认 workers.dev 子域名，仅用于在摘要里给出访问地址
            SUBDOMAIN_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" || echo "{}")

            WORKERS_SUBDOMAIN=$(echo "$SUBDOMAIN_JSON" | jq -r '.result.subdomain // empty' 2>/dev/null || echo "")

            if [ -n "$WORKERS_SUBDOMAIN" ]; then
              echo "APP_URL=https://domain-hub.${WORKERS_SUBDOMAIN}.workers.dev" >> $GITHUB_ENV
            fi
          fi

      # 这里只验证注入 D1 / 路由后的配置；Worker 与静态资源来自同一次验证，不重新构建。
      - name: Dry run the verified Worker with bound deployment config
        if: steps.freshness.outputs.current == 'true'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy release/worker/index.js --no-bundle --dry-run --outdir "${RUNNER_TEMP}/domain-hub-bound-config"

      # 一次 deploy 同时上传 Worker 脚本与 frontend/dist 里的静态资源
      - name: Deploy Worker (API + Frontend Assets)
        if: steps.freshness.outputs.current == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.0'
          command: deploy release/worker/index.js --no-bundle

      - name: Auto-Configure & Sync AES_KEY Secret
        if: steps.freshness.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          # 1. GitHub Secrets 已配置 AES_KEY → 优先使用用户自定义密钥
          if [ -n "$AES_KEY" ]; then
            echo "🔐 使用 GitHub Secret 中配置的 AES_KEY 同步到 Worker..."
            echo "$AES_KEY" | npx wrangler secret put AES_KEY
          # 2. Worker 上已有 AES_KEY → 保持稳定，不重新生成（否则已加密数据将无法解密）
          elif npx wrangler secret list 2>/dev/null | grep -q "AES_KEY"; then
            echo "🔐 AES_KEY 已存在于 Worker，保持现有密钥不变..."
          # 3. 首次部署 → 自动生成随机 AES_KEY 并写入 Worker
          else
            echo "🔐 首次部署，自动生成 AES_KEY 并写入 Worker..."
            NEW_KEY=$(openssl rand -hex 32)
            echo "$NEW_KEY" | npx wrangler secret put AES_KEY
            # 尽力写回 GitHub Secrets，便于本地开发参考（失败不影响部署）
            if command -v gh >/dev/null 2>&1; then
              echo "$NEW_KEY" | gh secret set AES_KEY --repo "${GITHUB_REPOSITORY}" || true
            fi
          fi

      - name: Sync Optional Secrets to Worker (if set)
        if: steps.freshness.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then
            echo "🔑 正在同步更新 ADMIN_TOKEN 口令到 Cloudflare Worker..."
            echo "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN || true
          fi
          if [ -n "$WEBHOOK_URL" ]; then
            echo "🔔 正在同步更新 WEBHOOK_URL 推送地址到 Cloudflare Worker..."
            echo "$WEBHOOK_URL" | npx wrangler secret put WEBHOOK_URL || true
          fi
          # 前后端同源后，正常部署不需要这一项；只有把前端另行托管到别的域名时才要配，
          # 漏配的表现是登录页一句 Failed to fetch。
          if [ -n "$ALLOWED_ORIGIN" ]; then
            echo "🌐 正在同步更新 ALLOWED_ORIGIN 跨域白名单到 Cloudflare Worker..."
            echo "$ALLOWED_ORIGIN" | npx wrangler secret put ALLOWED_ORIGIN || true
          fi

      - name: Summarize Access URL
        if: steps.freshness.outputs.current == 'true'
        env:
          APP_URL: ${{ env.APP_URL }}
        run: |
          {
            echo "### 访问地址"
            echo
            if [ -n "$APP_URL" ]; then
              echo "\`${APP_URL}\`"
              echo
              echo "前端与 API 都在这个地址上（同一个 Worker）。首次进入请在登录页自行设置管理员用户名与密码。"
            else
              echo "⚠️ 未能检测到访问地址（既无自定义域名，也未取到 workers.dev 子域）。"
              echo "部署本身可能已成功，请到 Cloudflare Dashboard → Workers & Pages 查看。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

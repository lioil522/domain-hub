name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - name: Audit both dependency trees (fail closed, no automatic fixes)
        shell: bash
        run: |
          root_status=0
          frontend_status=0
          npm audit --json > audit-root.json || root_status=$?
          npm --prefix frontend audit --json > audit-frontend.json || frontend_status=$?
          test "$root_status" = 0 && test "$frontend_status" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: audit-*.json
  deploy:
    needs: [verify, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify manual main deployment
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/release-preflight.mjs manual

      # wrangler 4 的 engines 要求 Node >= 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Bind configured existing D1 database (never auto-create)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/release-preflight.mjs bind

      - name: Check existing AES secret metadata before deployment (never rotate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler secret list --format json > secret-names.json
          node scripts/release-preflight.mjs secrets

      # Forks default to workers.dev; existing sites must retain their own route config.
      # Never interpret failed or partial API discovery as an absent binding.

      # 必须在 wrangler deploy 之前：wrangler.toml 的 assets.directory 指向 frontend/dist，
      # 目录不存在部署会直接失败。
      #
      # VITE_API_BASE_URL 设成 "/"：前端与 Worker 同源，App.tsx 里会把末尾斜杠削掉，
      # 请求最终是 /api/xxx 这样的相对路径，既不用配 CORS，也不用把域名烘焙进产物。
      - name: Build Frontend
        env:
          VITE_API_BASE_URL: /
        run: |
          cd frontend
          npm run build

      # 一次 deploy 同时上传 Worker 脚本与 frontend/dist 里的静态资源
      - name: Deploy Worker (API + Frontend Assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          command: deploy --keep-vars

      - name: Summarize Access URL
        env:
          APP_URL: ${{ vars.RELEASE_APP_URL }}
        run: |
          {
            echo "### 访问地址"
            echo
            if [ -n "$APP_URL" ]; then
              echo "\`${APP_URL}\`"
              echo
              echo "这是配置的预期地址，不是健康/容量/迁移验收结果；请检查管理员与凭据。"
            else
              echo "请在 Cloudflare Dashboard → Workers & Pages → 对应 Worker 查看 workers.dev 地址或自定义域名。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

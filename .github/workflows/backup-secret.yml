name: Encrypted AES recovery backup

# This manual recovery job does not deploy, mutate Cloudflare, or expose AES.
on:
  workflow_dispatch:
    inputs:
      approved_backup_sha:
        description: 'Exact 40-character main SHA reviewed for this encrypted backup'
        required: true
        type: string
      recipient_public_key_base64:
        description: 'Base64-encoded RSA SPKI public PEM; private key must stay offline'
        required: true
        type: string
      expected_account_id:
        description: 'Cloudflare Account ID confirmed by read-only target inspection'
        required: true
        type: string
      expected_d1_database_id:
        description: 'Existing D1 UUID associated with the separately exported database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: encrypted-aes-recovery-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify envelope and fail-closed guards using synthetic secrets only
        run: node --test scripts/backup-secret-envelope.test.mjs
      - name: Encrypt original GitHub AES secret for the local recipient
        env:
          APPROVED_BACKUP_SHA: ${{ inputs.approved_backup_sha }}
          RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.recipient_public_key_base64 }}
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          EXPECTED_D1_DATABASE_ID: ${{ inputs.expected_d1_database_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: node scripts/backup-secret-envelope.mjs
      - name: Upload encrypted artifact only (never plaintext or a private key)
        uses: actions/upload-artifact@v4
        with:
          name: aes-recovery-envelope-${{ github.run_id }}
          path: secret-backup/AES_KEY.envelope.json
          if-no-files-found: error
          retention-days: 1
